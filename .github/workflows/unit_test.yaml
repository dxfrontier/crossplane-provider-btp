# This workflow will builds a golang project and runs unit-tests
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Unit Tests

on:
  workflow_call: 

env:
  GO_VERSION: '1.25'

permissions:
  contents: read
jobs:

  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      with:
        submodules: true 

    - name: Set up Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Build
      # cmd/exporter excluded: xp-clifford depends on crossplane-runtime v1 which is
      # incompatible with controller-runtime v0.23.1 (missing Apply method).
      # Re-enable once xp-clifford is updated to crossplane-runtime/v2.
      # Note: cannot use `go list ./... | grep -v` because go list exits non-zero
      # on cmd/exporter type errors and pipefail propagates the failure.
      run: go build -v ./cmd/provider/... ./cmd/generator/... ./internal/... ./apis/... ./test/... ./scripts/...

    - name: Unit-Test Init
      run: make test.init
    - name: Unit-Test Run
      run: make test.run
