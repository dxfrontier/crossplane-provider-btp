# DXF Release - builds and publishes a new dxfrontier fork release.
# Simplified from upstream release.yaml: skips e2e tests and license checks.
# Vars:
# REGISTRY_URL: registry url for the container registry

name: DXF Release

env:
  GO_VERSION: '1.25'

on:
  workflow_dispatch:
    inputs:
      nextVersion:
        description: 'Release version in semver format, e.g. v1.6.1-dxf.1'
        required: true

jobs:
  run-unit-test:
    uses: ./.github/workflows/unit_test.yaml
    permissions:
      contents: read

  run-make-reviewable-and-check-diff:
    uses: ./.github/workflows/reviewable_check_diff.yaml
    permissions:
      contents: read

  release:
    runs-on: ubuntu-latest
    needs:
    - run-unit-test
    - run-make-reviewable-and-check-diff
    permissions:
      contents: write
      packages: write

    steps:
    - name: Print Version Number
      run: echo "Building release version ${{ github.event.inputs.nextVersion }}"

    - name: Tag head with version
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      with:
        script: |
          github.rest.git.createRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: 'refs/tags/${{ github.event.inputs.nextVersion }}',
            sha: context.sha
          })

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      with:
        version: v0.15.1
        install: true

    - name: Checkout code
      uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      with:
        submodules: true

    - name: Fetch History
      run: git fetch --prune --unshallow

    - name: Set up Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Vendor Dependencies
      run: make vendor vendor.check

    - name: Build Images
      run: make build
      env:
        BUILD_ARGS: "--load"
        DOCKER_REGISTRY: ${{ vars.REGISTRY_URL }}
        BUILD_REGISTRY: ${{ vars.REGISTRY_URL }}

    - name: Login to GHCR
      uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish Artifacts
      run: make publish BRANCH_NAME=${GITHUB_REF##*/}
      env:
        DOCKER_REGISTRY: ${{ vars.REGISTRY_URL }}
        BUILD_REGISTRY: ${{ vars.REGISTRY_URL }}

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
      with:
        distribution: goreleaser
        version: "~> v2"
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
